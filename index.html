<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shin Budokai 2 · Transformations Tool</title>
<style>
[hidden] { display: none !important; }
:root {
  /* tema verde (toni del menu di Shin Budokai, schermata di ERI) */
  --bg: #0e2520; --card: #13302a; --card2: #183b33; --line: #245246; --fg: #e5f3ee; --muted: #9dbfb3; --head: #1d5547;
  --accent: #3fcf8e; --accent2: #7fe0b5; --ok: #3fcf8e; --warn: #f2c94c; --err: #ff6b6b; --blue: #2a9d7c;
  --radius: 12px;
  font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { min-height: 100vh; display: flex; flex-direction: column; }
#hero { position: relative; background: linear-gradient(120deg, #15453a, #0b231d); background-size: cover; background-position: center; }
#hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,26,21,.92), rgba(8,26,21,.55)); }
.hero-inner { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 22px 20px; display: flex; gap: 20px; align-items: center; }
#logo { height: 96px; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.5); image-rendering: auto; }
.titles { flex: 1; min-width: 0; }
h1 { margin: 0; font-size: 26px; letter-spacing: .3px; }
.titles p { margin: 6px 0 0; color: var(--muted); }
.lang { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
main { max-width: 1080px; width: 100%; margin: 0 auto; padding: 18px 20px 30px; display: grid; gap: 16px; flex: 1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
h2 { margin: 0 0 14px; font-size: 18px; color: var(--accent2); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row input[type=text] { flex: 1; min-width: 240px; }
input[type=text], select { background: var(--card2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: inherit; }
select { padding: 7px 9px; }
.btn { background: var(--accent); color: #062018; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.big { padding: 12px 26px; font-size: 16px; }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.status { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--card2); border-left: 4px solid var(--blue); display: flex; gap: 14px; align-items: center; }
.status.ok { border-color: var(--ok); } .status.warn { border-color: var(--warn); } .status.err { border-color: var(--err); }
.status img { height: 54px; border-radius: 6px; }
.status .txt { display: flex; flex-direction: column; gap: 3px; }
.status small { color: var(--muted); }
.presets { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; margin-bottom: 12px; }
.preset { flex: 1; min-width: 240px; text-align: left; background: var(--card2); color: var(--fg); border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 4px; }
.preset span { color: var(--muted); font-size: 13px; }
.preset.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.badge { align-self: center; background: var(--blue); color: white; border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; cursor: pointer; }
.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
.check span { display: flex; flex-direction: column; gap: 3px; }
.check small { color: var(--muted); font-size: 13px; }
.check.disabled { opacity: .45; cursor: not-allowed; }
.sub { margin: -2px 0 8px 28px; display: flex; gap: 10px; align-items: center; color: var(--muted); }
.sub.hidden { display: none; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: var(--head); color: var(--fg); font-weight: 600; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td.name { white-space: nowrap; font-weight: 600; width: 1%; }
.forms { display: flex; gap: 8px; flex-wrap: wrap; }
.form { display: flex; align-items: center; gap: 6px; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 10px; }
.form label { font-size: 13px; white-space: nowrap; }
.form select { padding: 4px 6px; min-width: 52px; }
.form.bad { border-color: var(--err); background: rgba(255,107,107,.12); }
.errors { margin-top: 12px; color: var(--err); font-size: 14px; }
.errors div { margin: 3px 0; }
.actions { margin-top: 14px; }
.spacer { flex: 1; }
.lbl { color: var(--muted); }
#progress { margin-top: 14px; display: flex; gap: 12px; align-items: center; }
.bar { flex: 1; height: 12px; background: var(--card2); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
#bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
#phase { min-width: 180px; color: var(--muted); }
footer { max-width: 1080px; width: 100%; margin: 0 auto; padding: 10px 20px 22px; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; }
footer span:first-child { flex: 1; }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--line); padding: 10px 18px; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
code { background: var(--card2); padding: 2px 6px; border-radius: 5px; color: var(--accent2); }
.load-wrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.load-prev { position: relative; flex: 0 0 auto; width: 300px; aspect-ratio: 480 / 272; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.lp-band { position: absolute; left: 0; right: 0; top: 14.3%; height: 70%; background: #ff8e08;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.35); border-top: 2px solid #1e170e; border-bottom: 2px solid #1e170e; }
.lp-text { position: absolute; left: -4px; right: 0; top: 87%; white-space: nowrap; overflow: hidden; font: italic 900 11px/1 "Arial Black", Impact, sans-serif;
  color: #ff5a1c; letter-spacing: .5px; text-shadow: 0 0 2px #fff, 0 0 1px #fff; text-transform: uppercase; }
.load-prev[data-v=US] .lp-text, .load-prev[data-v=JP] .lp-text { text-transform: none; font-style: normal; font-weight: 700; font-family: Impact, "Arial Narrow", sans-serif;
  color: #9dff7a; text-shadow: 0 0 2px #0a3d0a, 0 0 1px #0a3d0a; letter-spacing: 0; }
.load-ctl { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.load-pick { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.load-pick input[type=color] { width: 46px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card2); cursor: pointer; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.swatch.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--accent); }
.load-ctl .hint { margin: 0; }
@media (max-width: 700px) {
  .load-prev { width: 100%; }
  .hero-inner { flex-wrap: wrap; gap: 12px; padding: 16px; }
  #logo { height: 56px; }
  .titles { flex: 1 1 60%; }
  h1 { font-size: 19px; }
  .titles p { font-size: 13px; }
  .lang { flex: 1 1 100%; flex-direction: row; align-items: center; gap: 8px; }
  .lang select { flex: 1; }
  main { padding: 12px 12px 24px; gap: 12px; }
  .card { padding: 14px 14px; }
  .row input[type=text] { min-width: 0; flex: 1 1 100%; }
  .preset { min-width: 0; flex: 1 1 100%; }
  .table-wrap { border: 0; }
  table, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }
  tr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; padding: 8px 10px; background: var(--card); }
  td { border: 0; padding: 0; }
  td.name { width: auto; margin-bottom: 6px; }
  .forms { gap: 6px; }
  .form label { white-space: normal; }
  .status { flex-wrap: wrap; }
  .actions .btn { flex: 1 1 100%; text-align: center; }
  .actions .spacer { display: none; }
  #phase { min-width: 0; }
  footer { flex-wrap: wrap; padding: 10px 12px 20px; }
  .sub { margin-left: 28px; flex-wrap: wrap; }
}
html, body { overflow-x: hidden; }

.lost { position: sticky; top: 0; z-index: 10; background: var(--err); color: #1a0606; font-weight: 600; padding: 10px 20px; text-align: center; }
/* volti dei personaggi (dall'ISO caricata) */
.face { display: block; width: 96px; height: 32px; object-fit: contain; pointer-events: none; user-select: none; }
td.name .face.base { margin-bottom: 4px; }
.form.has-face { display: grid; grid-template-columns: 96px auto; grid-template-rows: auto auto; gap: 3px 6px; align-items: center; padding: 5px 5px 4px 5px; }
.form.has-face .face { grid-column: 1; grid-row: 1; border-radius: 4px; background: rgba(0,0,0,.18); }
.form.has-face .fl { display: contents; }
.form.has-face select { grid-column: 2; grid-row: 1; }
.form.has-face label { grid-column: 1 / span 2; grid-row: 2; padding-left: 2px; overflow: hidden; text-overflow: ellipsis; }
/* anteprima del lampo delle trasformazioni */
.flash-prev { position: relative; flex: 0 0 auto; width: 300px; aspect-ratio: 480 / 272; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--fc, #ffffff); }
.fp-glow { position: absolute; left: 6%; top: 8%; width: 64%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.85) 0 14%, rgba(255,255,255,0) 58%); box-shadow: inset 0 0 0 3px rgba(0,0,0,.16), inset 0 0 26px rgba(0,0,0,.18); }
.fp-ray { position: absolute; left: -10%; top: 46%; width: 130%; height: 2px; background: rgba(0,0,0,.28); transform: rotate(-9deg); }
.fp-ray.r2 { top: 30%; transform: rotate(14deg); width: 120%; }
/* sagoma (1.9.3): figura generica colorata come la tinta del modello nel gioco */
.fp-sil { position: absolute; right: 17%; bottom: 8%; width: 11%; height: 60%; }
.fp-sil::before { content: ''; position: absolute; left: 20%; top: 0; width: 60%; aspect-ratio: 1; border-radius: 50%; background: var(--sc, #ffffff); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.fp-sil::after { content: ''; position: absolute; left: 0; top: 23%; width: 100%; height: 77%; border-radius: 45% 45% 10% 10%; background: var(--sc, #ffffff); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.sil-pick { margin-top: 14px; }
@media (max-width: 700px) { .flash-prev { width: 100%; } }

/* codice di compatibilità online */
.compat { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--card2); }
.compat .hint { margin-top: 6px; }
#compat-code { font-size: 18px; font-weight: 700; letter-spacing: .08em; padding: 4px 10px; background: var(--card); user-select: all; }
.compat .share-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
#share-code { font-size: 14px; font-weight: 700; letter-spacing: .04em; padding: 4px 8px; background: var(--card); user-select: all; overflow-wrap: anywhere; }
.compat .row + .row { margin-top: 8px; }

</style>

<body>
<header id="hero">
  <div class="hero-inner">
    <img id="logo" alt="" hidden>
    <div class="titles">
      <h1 data-t="app_title">Shin Budokai 2 · Transformations Tool</h1>
      <p data-t="subtitle"></p>
    </div>
    <label class="lang"><span data-t="lang_label">Language</span>
      <select id="lang"></select>
    </label>
  </div>
</header>

<main>
  <section class="card" id="sec-iso">
    <h2 data-t="s_iso"></h2>
    <div class="row">
      <button id="btn-browse-in" class="btn" data-t="browse"></button>
      <input id="in-path" type="text" spellcheck="false" data-tp="iso_placeholder">
      <input type="file" id="file-iso" hidden>
      <button id="btn-load" class="btn ghost" data-t="load"></button>
    </div>
    <p class="hint" data-t="iso_hint"></p>
    <p class="hint" id="web-privacy" data-t="web_privacy" hidden></p>
    <div id="iso-status" class="status" hidden></div>
  </section>

  <section class="card" id="sec-ki">
    <h2 data-t="s_ki"></h2>
    <div class="presets">
      <button class="preset" id="p-std"><b data-t="preset_std"></b><span data-t="preset_std_desc"></span></button>
      <button class="preset" id="p-b3"><b data-t="preset_b3"></b><span data-t="preset_b3_desc"></span></button>
      <div class="badge" id="custom-badge" data-t="custom" hidden></div>
    </div>
    <label class="check"><input type="checkbox" id="kimax"><span><b data-t="kimax"></b><small data-t="kimax_desc"></small></span></label>
    <div class="table-wrap"><table id="ki-table"><thead><tr><th data-t="col_char"></th><th data-t="col_forms"></th></tr></thead><tbody></tbody></table></div>
    <p class="hint" data-t="ki_hint"></p>
    <div id="ki-errors" class="errors" hidden></div>
  </section>

  <section class="card" id="sec-rev">
    <h2 data-t="s_rev"></h2>
    <label class="check"><input type="checkbox" id="rev-down"><span><b data-t="rev_down"></b><small data-t="rev_down_desc"></small></span></label>
    <div class="sub" id="rev-cost-row"><span data-t="rev_cost"></span> <select id="rev-cost"></select></div>
    <label class="check"><input type="checkbox" id="rev-up"><span><b data-t="rev_up"></b><small data-t="rev_up_desc"></small></span></label>
    <div class="sub" id="rev-up-cost-row"><span data-t="rev_cost"></span> <select id="rev-up-cost"></select></div>
    <p class="hint" data-t="rev_note"></p>
  </section>

  <section class="card" id="sec-extra">
    <h2 data-t="s_extra"></h2>
    <label class="check"><input type="checkbox" id="gk"><span><b data-t="gk"></b><small data-t="gk_desc"></small></span></label>
    <label class="check"><input type="checkbox" id="sp-metal"><span><b data-t="sp_metal"></b><small data-t="sp_metal_desc"></small></span></label>
    <label class="check"><input type="checkbox" id="sp-buu"><span><b data-t="sp_buu"></b><small data-t="sp_buu_desc"></small></span></label>
  </section>

  <section class="card" id="sec-load">
    <h2 data-t="s_load"></h2>
    <div class="load-wrap">
      <div class="load-prev" aria-hidden="true">
        <div class="lp-band" id="lp-band"></div>
        <div class="lp-text">Now Loading... Now Loading... Now Loading... Now Loading...</div>
      </div>
      <div class="load-ctl">
        <label class="load-pick"><span data-t="load_color"></span><input type="color" id="load-color" value="#ff8e08"><code id="load-hex">#FF8E08</code></label>
        <div class="swatches" id="swatches"></div>
        <button class="btn ghost small" id="load-reset" data-t="load_reset"></button>
        <p class="hint" data-t="load_desc"></p>
      </div>
    </div>
  </section>

  <section class="card" id="sec-flash">
    <h2 data-t="s_flash"></h2>
    <div class="load-wrap">
      <div class="flash-prev" id="flash-prev" aria-hidden="true"><div class="fp-ray"></div><div class="fp-ray r2"></div><div class="fp-glow"></div><div class="fp-sil"></div></div>
      <div class="load-ctl">
        <label class="load-pick"><span data-t="flash_color"></span><input type="color" id="flash-color" value="#ffffff"><code id="flash-hex">#FFFFFF</code></label>
        <div class="swatches" id="flash-swatches"></div>
        <button class="btn ghost small" id="flash-reset" data-t="flash_reset"></button>
        <p class="hint" data-t="flash_desc"></p>
        <label class="load-pick sil-pick"><span data-t="sil_color"></span><input type="color" id="sil-color" value="#ffffff"><code id="sil-hex">#FFFFFF</code></label>
        <div class="swatches" id="sil-swatches"></div>
        <button class="btn ghost small" id="sil-reset" data-t="sil_reset"></button>
        <p class="hint" data-t="sil_desc"></p>
      </div>
    </div>
  </section>

  <section class="card" id="sec-create">
    <h2 data-t="s_create"></h2>
    <div class="compat">
      <div class="row"><span class="lbl" data-t="compat_label"></span><code id="compat-code"></code><button id="btn-copy-code" class="btn ghost small" data-t="compat_copy"></button></div>
      <p class="hint" data-t="compat_desc"></p>
      <div class="row share-row"><span class="lbl" data-t="share_label"></span><code id="share-code"></code><button id="btn-copy-share" class="btn ghost small" data-t="compat_copy"></button></div>
      <div class="row"><input id="share-in" type="text" spellcheck="false" autocomplete="off" data-tp="share_ph"><button id="btn-share-apply" class="btn ghost small" data-t="share_apply"></button></div>
      <p class="hint" data-t="share_desc"></p>
    </div>
    <div class="row" id="out-row">
      <span class="lbl" data-t="out_label"></span>
      <input id="out-path" type="text" spellcheck="false">
      <button id="btn-browse-out" class="btn ghost" data-t="browse"></button>
    </div>
    <div class="row actions">
      <button id="btn-create" class="btn big" data-t="create"></button>

    fr.addEventListener('click', async () => { try { await engine('cleanup', {}); } catch { } URL.revokeObjectURL(webOut.url); a.remove(); fr.remove(); tip.textContent = t('freed'); });

  $('btn-share-apply').addEventListener('click', applyShare);
  $('share-in').addEventListener('keydown', e => { if (e.key === 'Enter') applyShare(); });
  $('file-settings').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { loadSettings(JSON.parse(await f.text())); toast(t('settings_loaded')); } catch { toast(t('settings_bad')); }
  });
  $('btn-quit').addEventListener('click', async () => { await api('/api/quit'); document.body.innerHTML = '<main><div class="card">' + t('closed') + '</div></main>'; });
  if (!WEB) {
    setInterval(() => api('/api/ping').catch(() => {}), 3000);
    window.addEventListener('pagehide', () => navigator.sendBeacon('/api/bye?t=' + TOKEN));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) api('/api/ping').catch(() => {}); });
  }
  await setLang(pickLang(ini.lang), false);
  if ($('nobrowser')) $('nobrowser').textContent = t('err_browser');
  if (ini.settings) { try { loadSettings(ini.settings); } catch {} }
  refresh();
}
init().catch(e => { document.body.insertAdjacentHTML('afterbegin', '<p style="color:#f66;padding:12px">' + e + '</p>'); });

</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
